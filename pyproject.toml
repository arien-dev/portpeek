[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portpeek"
version = "0.2.0"
description = "Fast TCP port and range checker for local and remote hosts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [
  { name = "Arien" }
]
dependencies = []

[project.scripts]
portpeek = "portpeek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
